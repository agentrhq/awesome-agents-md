name: validate

on:
  pull_request:
    paths:
      - 'stacks/**/AGENTS.md'
      - 'stacks/**/README.md'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AGENTS.md schema, length, and em-dashes
        run: node tools/agents-md-lint/bin/agents-md-lint.js stacks/

      - name: Validate per-stack README frontmatter
        run: |
          set -u
          REQUIRED_KEYS=("stack_slug" "display_name" "components" "verified_with" "last_verified" "maintainer" "license")
          fail=0

          while IFS= read -r f; do
            echo "::group::$f"
            if ! head -1 "$f" | grep -qx -- '---'; then
              echo "::error file=$f::missing YAML frontmatter (first line must be '---')"
              fail=1
              echo "::endgroup::"
              continue
            fi
            for k in "${REQUIRED_KEYS[@]}"; do
              if ! awk '/^---$/{c++; next} c==1' "$f" | grep -qE "^${k}:"; then
                echo "::error file=$f::frontmatter missing '${k}'"
                fail=1
              fi
            done
            echo "::endgroup::"
          done < <(find stacks -mindepth 2 -maxdepth 2 -type f -name README.md)

          exit $fail

      - name: Reject em-dashes in non-AGENTS docs
        run: |
          set -u
          fail=0
          while IFS= read -r f; do
            if grep -nP '\xe2\x80\x94' "$f" > /tmp/dashes 2>/dev/null; then
              echo "::error file=$f::em-dash found (use period, comma, or middle dot)"
              cat /tmp/dashes
              fail=1
            fi
          done < <(find . -type f -name '*.md' ! -name 'AGENTS.md' ! -path './node_modules/*' ! -path './.git/*')
          exit $fail
